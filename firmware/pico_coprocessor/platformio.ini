[env:pico]
; Official platform အစား Earle Philhower core ပါဝင်သော Custom Platform ကို သုံးရန်
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200

; JSON အသုံးပြုနိုင်ရန် ArduinoJson Library ကို ထည့်သွင်းခြင်း
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
