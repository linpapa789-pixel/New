name: Build Pico Firmware

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'firmware/pico_coprocessor/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'firmware/pico_coprocessor/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Build PlatformIO Project
      run: |
        cd firmware/pico_coprocessor
        pio run

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pico-rp2040-firmware
        path: firmware/pico_coprocessor/.pio/build/pico/firmware.uf2
