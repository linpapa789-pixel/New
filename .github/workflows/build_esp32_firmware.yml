name: Build ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'esp32_firmware/**'
      - '.github/workflows/**'
  workflow_dispatch: # Allows you to trigger the build manually from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install Required Libraries
        run: |
          arduino-cli lib install ArduinoJson
          # Install AsyncTCP and ESPAsyncWebServer manually since they require GitHub versions for ESP32
          mkdir -p ~/Arduino/libraries
          cd ~/Arduino/libraries
          git clone https://github.com/me-no-dev/AsyncTCP.git
          git clone https://github.com/me-no-dev/ESPAsyncWebServer.git

      - name: Compile ESP32-S3 Firmware
        run: |
          mkdir -p build_output
          # Compiling specifically for ESP32-S3
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir build_output esp32_firmware/esp32_firmware.ino

      - name: Upload Compiled .bin File
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_Diagnostic_Firmware
          path: build_output/*.bin
          retention-days: 7
